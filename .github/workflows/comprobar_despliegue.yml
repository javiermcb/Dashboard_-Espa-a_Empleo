name: Comprobar el despliegue de la barra lateral

# Solo a mano («Run workflow»): abre cada dashboard desplegado y mide el ancho de su barra lateral para saber si ya está
# publicada la versión con la barra mínima (~76 px). URLs: variables del repositorio APP_URL_1 … APP_URL_3.
on:
  workflow_dispatch:
    inputs:
      texto_d2:
        description: "Opcional: texto que debe verse en el Dashboard 2 desplegado (p. ej. el título de una sección nueva)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Navegador
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Comprobar un texto en el Dashboard 2 desplegado
        if: ${{ inputs.texto_d2 != '' }}
        env:
          APP_URL_2: ${{ vars.APP_URL_2 }}
          TEXTO: ${{ inputs.texto_d2 }}
        run: |
          set -o pipefail  # sin esto, «| tee» oculta el fallo del script y el paso saldría verde aunque el texto no se vea
          python ops/comprobar_despliegue.py "$APP_URL_2" --texto "$TEXTO" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Medir la barra lateral de cada app
        env:
          APP_URL_1: ${{ vars.APP_URL_1 }}
          APP_URL_2: ${{ vars.APP_URL_2 }}
          APP_URL_3: ${{ vars.APP_URL_3 }}
        run: |
          set -o pipefail  # el fallo del script no debe quedar oculto por «| tee»
          fallo=0
          for v in APP_URL_1 APP_URL_2 APP_URL_3; do
            url="${!v}"
            [ -n "$url" ] || { echo "$v sin definir: se salta"; continue; }
            python ops/comprobar_despliegue.py "$url" | tee -a "$GITHUB_STEP_SUMMARY" || fallo=1
          done
          exit $fallo
