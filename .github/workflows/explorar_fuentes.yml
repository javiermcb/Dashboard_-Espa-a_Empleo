name: Explorar fuentes (FUNDAE y SEPE)

# Solo a mano («Run workflow»). Exploración de solo lectura: lista las series de FUNDAE que el pipeline todavía no carga y descarga
# la ficha «Demandantes de empleo por nivel formativo» del SEPE para ver su estructura. No escribe nada en el repositorio:
# el resultado queda en el log y en el resumen del job.
on:
  workflow_dispatch:
    inputs:
      volcar:
        description: "Opcional: solo vuelca la estructura de estas series de FUNDAE (números separados por espacios, p. ej. «11 12 13 16»)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install -r pipeline/requirements.txt
      - name: Explorar
        env:
          VOLCAR: ${{ inputs.volcar }}
        run: |
          if [ -n "$VOLCAR" ]; then python ops/explorar_fuentes.py --volcar $VOLCAR; else python ops/explorar_fuentes.py --fundae-max-min 14; fi
