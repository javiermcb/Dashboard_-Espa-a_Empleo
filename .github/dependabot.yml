# Avisos y propuestas de actualización (pull requests) para las acciones de GitHub y las librerías fijadas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
